<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Great Goals Lifestyle</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="toast-container" id="toast-container"></div>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="assets/images/logo.png" alt="Great Goals Lifestyle" style="width:78px;height:78px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 16px rgba(245,184,0,0.5);margin:0 auto 0.75rem;object-fit:cover;display:block;">
      <h2>Great Goals Lifestyle</h2>
      <p>Sign in to your account</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="loginTab" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" id="registerTab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <div id="loginForm">
      <div class="form-group">
        <label><i class="fas fa-id-card"></i> Member ID</label>
        <input type="text" class="form-control" id="loginId" placeholder="Enter your Member ID (e.g. GG00001)" autocomplete="username">
      </div>
      <div class="form-group">
        <label><i class="fas fa-lock"></i> Password</label>
        <div style="position:relative;">
          <input type="password" class="form-control" id="loginPass" placeholder="Enter your password" autocomplete="current-password">
          <i class="fas fa-eye" id="eyeIcon" onclick="togglePass()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--gray);"></i>
        </div>
      </div>
      <div id="loginError"></div>
      <button class="btn btn-primary w-100" onclick="doLogin()" style="margin-top:.5rem;">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>
      <div class="auth-link">
        <p>Admin credentials: <strong>admin</strong> / <strong>Admin@1234</strong></p>
      </div>
    </div>

    <!-- Register Tab -->
    <div id="registerInfo" class="d-none">
      <div class="alert alert-info">
        <i class="fas fa-info-circle"></i>
        To register as a new member, please visit the Registration page. You will need a valid Sponsor ID from an existing member.
      </div>
      <a href="register.html" class="btn btn-primary w-100"><i class="fas fa-user-plus"></i> Go to Registration</a>
    </div>

    <div style="text-align:center;margin-top:1.5rem;">
      <a href="index.html" style="font-size:.83rem;color:var(--gray);">← Back to Home</a>
    </div>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
<script>
function showToast(msg, type='success'){
  const tc=document.getElementById('toast-container');
  const t=document.createElement('div');
  t.className=`toast ${type}`;
  t.innerHTML=`<i class="fas fa-${type==='success'?'check-circle':'exclamation-circle'} toast-icon"></i><span class="toast-msg">${msg}</span>`;
  tc.appendChild(t);
  setTimeout(()=>t.remove(),3500);
}

function togglePass(){
  const p=document.getElementById('loginPass');
  const i=document.getElementById('eyeIcon');
  if(p.type==='password'){ p.type='text'; i.className='fas fa-eye-slash'; }
  else { p.type='password'; i.className='fas fa-eye'; }
}

function switchTab(tab){
  if(tab==='login'){
    document.getElementById('loginTab').classList.add('active');
    document.getElementById('registerTab').classList.remove('active');
    document.getElementById('loginForm').classList.remove('d-none');
    document.getElementById('registerInfo').classList.add('d-none');
  } else {
    document.getElementById('registerTab').classList.add('active');
    document.getElementById('loginTab').classList.remove('active');
    document.getElementById('loginForm').classList.add('d-none');
    document.getElementById('registerInfo').classList.remove('d-none');
  }
}

async function doLogin(){
  const id=document.getElementById('loginId').value.trim();
  const pass=document.getElementById('loginPass').value;
  const errEl=document.getElementById('loginError');
  const btn=document.querySelector('#loginForm button.btn-primary');
  errEl.innerHTML='';

  if(!id||!pass){
    errEl.innerHTML='<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> Please enter Member ID and Password.</div>';
    return;
  }

  const origBtnHtml = btn ? btn.innerHTML : '';
  if(btn){
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
  }

  try {
    const res = await API.post('/api/auth/login', { id, password: pass });

    if(res && res.success){
      if(res.token) API.setToken(res.token);

      const isAdmin = !!res.isAdmin || res.role === 'ADMIN';
      const sessionObj = {
        id: res.user ? res.user.id : (isAdmin ? 'admin' : id),
        name: res.user ? res.user.name : (isAdmin ? 'Administrator' : id),
        isAdmin: isAdmin,
        role: isAdmin ? 'ADMIN' : 'CUSTOMER'
      };
      localStorage.setItem('gg_current_user', JSON.stringify(sessionObj));

      if(res.user && !isAdmin){
        const mems = APP.getMembers();
        const idx = mems.findIndex(m => m.id.toUpperCase() === res.user.id.toUpperCase());
        if(idx !== -1){
          mems[idx] = Object.assign(mems[idx], res.user);
        } else {
          mems.push(res.user);
        }
        APP.saveMembers(mems);
      }

      showToast('Login successful! Redirecting...', 'success');
      setTimeout(()=>{
        if(isAdmin) window.location.href='admin/admin-dashboard.html';
        else window.location.href='dashboard.html';
      }, 700);
    } else {
      if(btn){
        btn.disabled = false;
        btn.innerHTML = origBtnHtml;
      }
      const isPending = res.pending || (res.message && res.message.toLowerCase().includes('pending')) || (res.error && res.error.toLowerCase().includes('pending')) || (res.msg && res.msg.toLowerCase().includes('pending'));
      const isInactive = res.inactive || (res.message && res.message.toLowerCase().includes('inactive')) || (res.error && res.error.toLowerCase().includes('inactive')) || (res.msg && res.msg.toLowerCase().includes('inactive'));

      if(isPending){
        errEl.innerHTML=`<div class="alert alert-warning" style="background:#fef3c7;color:#92400e;border:1.5px solid #f59e0b;padding:0.9rem 1rem;line-height:1.5;border-radius:8px;">
          <div style="display:flex;align-items:flex-start;gap:0.6rem;">
            <i class="fas fa-user-clock" style="font-size:1.25rem;color:#d97706;margin-top:2px;"></i>
            <div>
              <strong style="display:block;font-size:0.95rem;margin-bottom:3px;color:#78350f;">Account Pending Approval</strong>
              <span style="font-size:0.86rem;">${res.msg || res.message || res.error || 'Your account has been registered successfully and is currently waiting for administrator approval. You will be able to access your account after the administrator activates it.'}</span>
            </div>
          </div>
        </div>`;
      } else if(isInactive){
        errEl.innerHTML=`<div class="alert alert-error" style="background:#fee2e2;color:#991b1b;border:1.5px solid #f87171;padding:0.9rem 1rem;line-height:1.45;border-radius:8px;">
          <i class="fas fa-ban" style="font-size:1.1rem;margin-right:0.4rem;color:#dc2626;"></i>
          <strong>Account Deactivated:</strong> ${res.msg || res.message || res.error || 'Your account is deactivated.'}
        </div>`;
      } else {
        errEl.innerHTML=`<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> ${res.msg || res.error || res.message || 'Invalid credentials. Please try again.'}</div>`;
      }
    }
  } catch(err){
    // Fallback to local authentication
    const localRes = APP.login(id, pass);
    if(localRes && localRes.success){
      const isAdmin = !!localRes.isAdmin || localRes.role === 'ADMIN';
      showToast('Login successful! Redirecting...', 'success');
      setTimeout(()=>{
        if(isAdmin) window.location.href='admin/admin-dashboard.html';
        else window.location.href='dashboard.html';
      }, 700);
      return;
    }

    if(btn){
      btn.disabled = false;
      btn.innerHTML = origBtnHtml;
    }
    if(localRes && localRes.pending){
      errEl.innerHTML=`<div class="alert alert-warning" style="background:#fef3c7;color:#92400e;border:1.5px solid #f59e0b;padding:0.9rem 1rem;line-height:1.5;border-radius:8px;">
        <div style="display:flex;align-items:flex-start;gap:0.6rem;">
          <i class="fas fa-user-clock" style="font-size:1.25rem;color:#d97706;margin-top:2px;"></i>
          <div>
            <strong style="display:block;font-size:0.95rem;margin-bottom:3px;color:#78350f;">Account Pending Approval</strong>
            <span style="font-size:0.86rem;">${localRes.msg}</span>
          </div>
        </div>
      </div>`;
    } else if(localRes && localRes.inactive){
      errEl.innerHTML=`<div class="alert alert-error" style="background:#fee2e2;color:#991b1b;border:1.5px solid #f87171;padding:0.9rem 1rem;line-height:1.45;border-radius:8px;">
        <i class="fas fa-ban" style="font-size:1.1rem;margin-right:0.4rem;color:#dc2626;"></i>
        <strong>Account Deactivated:</strong> ${localRes.msg}
      </div>`;
    } else {
      errEl.innerHTML=`<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> ${localRes ? localRes.msg : err.message}</div>`;
    }
  }
}

// Enter key
document.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

// Inform user if an active session exists without abrupt redirect
const activeSession = APP.getCurrentSession();
if(activeSession){
  const isAdm = activeSession.isAdmin || activeSession.role === 'ADMIN';
  const dashUrl = isAdm ? 'admin/admin-dashboard.html' : 'dashboard.html';
  const roleLabel = isAdm ? 'Administrator' : `Customer (${activeSession.id || ''})`;
  const container = document.querySelector('.auth-box') || document.querySelector('.card') || document.querySelector('.auth-card') || document.getElementById('loginForm');
  if(container){
    const sessionBanner = document.createElement('div');
    sessionBanner.style.cssText = 'margin-bottom:1.2rem;background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;border-radius:8px;padding:0.75rem 1rem;font-size:0.85rem;display:flex;align-items:center;justify-content:space-between;gap:0.5rem;flex-wrap:wrap;';
    sessionBanner.innerHTML = `
      <span><i class="fas fa-user-check text-primary"></i> Currently signed in as <strong>${roleLabel}</strong></span>
      <div style="display:flex;gap:0.4rem;">
        <a href="${dashUrl}" class="btn btn-primary btn-sm" style="padding:4px 10px;font-size:0.75rem;text-decoration:none;">Go to Dashboard &rarr;</a>
        <button onclick="APP.logout();location.reload();" class="btn btn-sm" style="padding:4px 8px;font-size:0.75rem;background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;cursor:pointer;border-radius:4px;">Logout</button>
      </div>
    `;
    container.parentNode.insertBefore(sessionBanner, container);
  }
}
</script>
</body>
</html>
